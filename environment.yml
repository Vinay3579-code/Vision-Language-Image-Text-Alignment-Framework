name: fashion-alignment

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # Core scientific stack
  - numpy>=1.26
  - pandas>=2.2
  - pillow>=10.2
  - scikit-learn>=1.4
  - tqdm>=4.66

  # PyTorch
  - pytorch>=2.2
  - torchvision>=0.17
  - torchaudio>=2.2
  - pytorch-cuda=12.1

  # Utilities
  - pip

  # Pip packages
  - pip:
      - open-clip-torch>=2.24.0
      - transformers>=4.40.0
      - huggingface-hub>=0.23.0
      - safetensors>=0.4.3
      - sentencepiece>=0.2.0
      - timm>=1.0.7
